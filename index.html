<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kod Eşleştir">
<meta name="theme-color" content="#1f6feb">
<title>Kod Eşleştir</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#6b7280;--accent:#1f6feb;--ok:#18a058;--bad:#d03050;--line:#d9dce1}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--text:#eef0f3;--muted:#9aa1ad;--line:#2d313a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:520px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button{font-size:16px;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:100%;margin-top:4px}
#result{display:none;text-align:center;font-size:22px;font-weight:700;padding:22px;border-radius:14px;margin-bottom:12px;color:#fff}
#result.ok{background:var(--ok)}#result.bad{background:var(--bad)}
#result small{display:block;font-size:14px;font-weight:400;margin-top:6px;opacity:.95}
#overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:10}
#vwrap{position:relative;width:100%;max-width:460px;border-radius:12px;overflow:hidden;background:#000}
#video{width:100%;display:block;max-height:60vh;object-fit:cover}
#guide{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none}
#overlay p{color:#fff;margin:12px 0;text-align:center}
#choices{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px}
#choices button{background:#2b3a55;text-align:left;word-break:break-all}
#close{background:#444;margin-top:10px}
</style>
</head>
<body>
<h1>Kod Eşleştir</h1>

<div id="result"></div>

<div class="card"><label>1. Kod</label><div class="row"><input id="f0" placeholder="Okut veya yaz"><button data-i="0">Tara</button></div></div>
<div class="card"><label>2. Kod</label><div class="row"><input id="f1" placeholder="Okut veya yaz"><button data-i="1">Tara</button></div></div>
<div class="card"><label>3. Kod</label><div class="row"><input id="f2" placeholder="Okut veya yaz"><button data-i="2">Tara</button></div></div>
<button class="ghost" id="reset">Temizle</button>

<div id="overlay">
  <div id="vwrap"><video id="video" playsinline muted autoplay></video><div id="guide"></div></div>
  <p id="hint">Barkodu çerçeveye alın, 15-25 cm uzaktan tutun</p>
  <div id="choices"></div>
  <button id="close">Kapat</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/inlined/index.js"></script>
<script>
const inputs=[0,1,2].map(i=>document.getElementById('f'+i));
const result=document.getElementById('result');
const overlay=document.getElementById('overlay');
const video=document.getElementById('video');
const choices=document.getElementById('choices');
const hint=document.getElementById('hint');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
let stream=null,current=null,running=false;

function check(){
  const v=inputs.map(i=>i.value.trim());
  if(v.some(x=>!x)){result.style.display='none';return}
  const ok=v[0]===v[1]&&v[1]===v[2];
  result.className=ok?'ok':'bad';
  result.innerHTML=ok?'✅ Eşleşti':'❌ Eşleşmedi';
  if(!ok){
    const pairs=[['1','2',0,1],['1','3',0,2],['2','3',1,2]]
      .filter(p=>v[p[2]]!==v[p[3]]).map(p=>p[0]+'-'+p[1]).join(', ');
    result.innerHTML+='<small>Uyuşmayan: '+pairs+'</small>';
  }
  result.style.display='block';
}

function stop(){
  running=false;
  overlay.style.display='none';
  choices.innerHTML='';
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;
}

function accept(text){
  inputs[current].value=text;
  if(navigator.vibrate)navigator.vibrate(80);
  stop();check();
}

async function loop(){
  if(!running)return;
  try{
    if(video.readyState>=2&&video.videoWidth){
      const scale=Math.min(1,1600/video.videoWidth);
      canvas.width=Math.round(video.videoWidth*scale);
      canvas.height=Math.round(video.videoHeight*scale);
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const syms=await zbarWasm.scanImageData(img);
      const vals=[...new Set(syms.map(s=>s.decode()).filter(Boolean))];
      if(running&&vals.length===1){accept(vals[0]);return}
      if(running&&vals.length>1){
        running=false;
        hint.textContent='Birden fazla kod bulundu, doğru olanı seçin:';
        choices.innerHTML='';
        vals.forEach(v=>{
          const b=document.createElement('button');
          b.textContent=v;b.onclick=()=>accept(v);
          choices.appendChild(b);
        });
        return;
      }
    }
  }catch(e){}
  setTimeout(loop,100);
}

async function start(i){
  current=i;
  hint.textContent='Barkodu çerçeveye alın, 15-25 cm uzaktan tutun';
  choices.innerHTML='';
  overlay.style.display='flex';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{
      facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    const track=stream.getVideoTracks()[0];
    try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    video.srcObject=stream;
    await video.play();
    running=true;
    loop();
  }catch(e){
    stop();
    alert('Kameraya erişilemedi. Tarayıcı ayarlarından kamera iznini kontrol edin.');
  }
}

document.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>start(+b.dataset.i));
document.getElementById('close').onclick=stop;
document.getElementById('reset').onclick=()=>{inputs.forEach(i=>i.value='');check()};
inputs.forEach(i=>i.addEventListener('input',check));
</script>
</body>
</html>
